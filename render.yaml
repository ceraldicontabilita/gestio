services:
  - type: web
    name: gestio-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/storage
      - key: CORS_ALLOWED_ORIGINS
        value: https://gestio-gw59.onrender.com
      # Import automatico Corrispettivi da Google Drive (opzionale): da
      # impostare manualmente in dashboard, non generabili automaticamente.
      # Vuoti = sync disattivata, nessun errore. Vedi README.md.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_CORRISPETTIVI_FOLDER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: gestio-db
          property: connectionString

  - type: web
    name: gestio-frontend
    runtime: static
    region: frankfurt
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gestio-api-crlo.onrender.com
