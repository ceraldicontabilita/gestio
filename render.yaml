services:
  - type: web
    name: gestio-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DOCUMENT_STORAGE_PATH
        value: /var/data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: gestio-db
          property: connectionString
